<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>织毯学土库曼语</title>
<meta name="description" content="零基础土库曼语学习游戏：从 30 个字母（相当于拼音）开始，经过元音和谐、词缀、句型、动词，到日常与旅行会话，一关织一个地毯纹样。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* ============ Tokens ============ */
:root{
  --ground:#EEF0F3;          /* Ashgabat marble white */
  --surface:#FFFFFF;
  --surface-2:#F6F7F9;
  --ink:#171A2B;
  --ink-2:#4F556C;
  --ink-3:#868CA3;
  --line:#D9DCE4;
  --madder:#9E1B32;          /* carpet red */
  --madder-2:#7C1426;
  --on-madder:#FFFFFF;
  --vb:#2A3D8F;              /* back / ýogyn vowels */
  --vf:#B35F00;              /* front / inçe vowels */
  --ok:#1F7A4D;
  --bad:#B42318;
  --ok-soft:#E3F2EA;
  --bad-soft:#FBE7E5;
  --shadow:0 1px 2px rgba(23,26,43,.06),0 8px 24px rgba(23,26,43,.07);
  /* the carpet is an object: its wool colours stay put in both themes */
  --rug:#8C1A2B;
  --rug-deep:#6F1322;
  --rug-ink:#1C2346;
  --rug-ivory:#F2E8D5;
  --rug-saffron:#E0A030;
  --rug-green:#2F7D57;
  --rug-indigo:#2B3A78;
  --f-display:"Unbounded","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Noto Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-ipa:"Noto Sans","Charis SIL","Doulos SIL","Lucida Grande","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10121B; --surface:#191C29; --surface-2:#1F2332; --ink:#ECEBF3; --ink-2:#B0B3C6; --ink-3:#7C8198; --line:#2D3246;
    --madder:#C6394F; --madder-2:#A42A3F; --vb:#97A8FF; --vf:#FFB548; --ok:#46B981; --bad:#FF7A6E;
    --ok-soft:#173327; --bad-soft:#3A1A1C; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#10121B; --surface:#191C29; --surface-2:#1F2332; --ink:#ECEBF3; --ink-2:#B0B3C6; --ink-3:#7C8198; --line:#2D3246;
  --madder:#C6394F; --madder-2:#A42A3F; --vb:#97A8FF; --vf:#FFB548; --ok:#46B981; --bad:#FF7A6E;
  --ok-soft:#173327; --bad-soft:#3A1A1C; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--vb);outline-offset:2px}
h1,h2,h3{text-wrap:balance;line-height:1.25;margin:0}
p{margin:0}
.wrap{max-width:1060px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Turkmen text + vowel tint */
.tk{font-weight:600;letter-spacing:.005em}
.vb{color:var(--vb)}
.vf{color:var(--vf)}
.plain .vb,.plain .vf{color:inherit}
.ipa{font-family:var(--f-ipa);color:var(--ink-2);font-weight:400;white-space:nowrap}
.nm{font-weight:700}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px;background:var(--madder);color:var(--on-madder);min-height:48px;transition:transform .08s ease,background .2s}
.btn:hover{background:var(--madder-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:14px;border-radius:10px}
.link{background:none;border:0;padding:6px 8px;border-radius:8px;color:var(--ink-2);font-weight:600;font-size:14px}
.link:hover{background:var(--surface-2);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:700;letter-spacing:.02em;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}

/* ============ Home ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:31px;flex:none}
.brand h1{font-size:20px;font-weight:800;letter-spacing:.01em}
.brand p{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav .badge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--madder);color:var(--on-madder);font-size:11px;padding:0 5px;margin-left:4px}

.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:end;padding-block:8px 20px}
.thesis{font-size:clamp(22px,3.4vw,34px);font-weight:800;line-height:1.3;letter-spacing:-.005em}
.thesis em{font-style:normal;color:var(--madder);white-space:nowrap}
.hero-sub{margin-top:10px;color:var(--ink-2);max-width:40em}
.hero-side{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.meter{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.meter div{display:flex;flex-direction:column}
.meter b{font-size:26px;line-height:1.1;font-family:var(--f-display);font-weight:700}
.meter span{font-size:12.5px;color:var(--ink-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding-block:6px 14px}
.legend i{font-style:normal;font-weight:800}

/* Carpet */
.rug-frame{padding:12px;border-radius:4px;box-shadow:var(--shadow);
  background:
    linear-gradient(135deg,var(--rug-saffron) 25%,transparent 25%) -9px 0/18px 18px,
    linear-gradient(225deg,var(--rug-saffron) 25%,transparent 25%) -9px 0/18px 18px,
    linear-gradient(315deg,var(--rug-saffron) 25%,transparent 25%) 0 0/18px 18px,
    linear-gradient(45deg,var(--rug-saffron) 25%,transparent 25%) 0 0/18px 18px,
    var(--rug-ink);}
.rug-inner{border:3px solid var(--rug-ivory);background:var(--rug);position:relative;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.07) 0 1px,transparent 1px 5px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);
  padding:6px 18px}
.rug-row{display:grid;grid-template-columns:168px 1fr;gap:14px;align-items:center;padding-block:14px;color:var(--rug-ivory)}
.rug-row+.rug-row{border-top:2px dotted rgba(242,232,213,.28)}
.row-label{display:flex;flex-direction:column;gap:2px}
.row-label .n{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;color:var(--rug-saffron)}
.row-label b{font-size:17px;line-height:1.3}
.row-label span{font-size:12.5px;opacity:.78}
.row-label .lk{font-size:12px;opacity:.7;margin-top:2px}
.guls{display:flex;flex-wrap:wrap;gap:6px 4px}
.gbtn{width:112px;background:none;border:0;border-radius:8px;padding:6px 4px;color:var(--rug-ivory);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.gbtn:hover:not([disabled]){background:rgba(242,232,213,.08)}
.gbtn svg{width:92px;height:62px;display:block}
.gbtn .code{font-family:var(--f-display);font-size:10.5px;letter-spacing:.1em;opacity:.8}
.gbtn .nm2{font-size:12.5px;line-height:1.25;font-weight:600}
.gbtn .st{font-size:11px;letter-spacing:.2em;color:var(--rug-saffron);min-height:14px;line-height:14px}
.gbtn[disabled]{opacity:.42;cursor:not-allowed}
.gbtn.next svg{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.home-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 36px;color:var(--ink-3);font-size:13px}
.proverb{font-size:13.5px;color:var(--ink-2)}

/* ============ Level ============ */
.lv-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px 12px;border-bottom:1px solid var(--line)}
.lv-row{display:flex;align-items:center;gap:10px}
.lv-title{flex:1;min-width:0}
.lv-title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv-title span{font-size:12.5px;color:var(--ink-3)}
.band{height:10px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.band i{display:block;height:100%;width:0;transition:width .45s ease;background:repeating-linear-gradient(135deg,var(--madder) 0 7px,var(--rug-saffron) 7px 9px,var(--madder) 9px 16px)}
.stage{max-width:720px;margin:0 auto;padding:20px 16px 190px}
.phase{font-size:12.5px;font-weight:700;letter-spacing:.12em;color:var(--madder);text-transform:uppercase;margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card h2{font-size:21px;margin-bottom:12px}
.card .body{color:var(--ink);font-size:16.5px}
.card .body p+p{margin-top:10px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--madder)}

/* letter card */
.lc{display:grid;grid-template-columns:auto 1fr;gap:18px 22px;align-items:start}
.lc-big{font-family:var(--f-display);font-weight:700;font-size:78px;line-height:1;letter-spacing:-.02em;min-width:1.6em}
.lc-meta{display:flex;flex-direction:column;gap:8px}
.lc-meta .ipa{font-size:22px}
.lc-zh{font-size:18px;font-weight:700}
.lc-tip{color:var(--ink-2)}
.lc-word{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;background:var(--surface-2)}
.lc-word .em{font-size:34px;line-height:1}
.lc-word .tk{font-size:22px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag-friend{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag-hat{background:var(--surface-2);color:var(--vb)}
.tag-trap{background:var(--bad-soft);color:var(--bad);border-color:transparent}

/* grids of items */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:14px}
.lgrid div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.lgrid b{font-family:var(--f-display);font-size:22px}
.lgrid .tk{display:block;font-size:15px}
.pairs{display:flex;flex-direction:column;margin-top:12px;border-top:1px solid var(--line)}
.pairs div{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.pairs .tk{font-size:17.5px}
.pairs span:last-child{color:var(--ink-2)}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table.tbl{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;font-size:15.5px}
.tbl th{font-size:13px;color:var(--ink-3);font-weight:700}
.tbl td:first-child{color:var(--ink-2);white-space:nowrap}
.chart{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin-top:14px}
.chart div{padding:10px;border-radius:10px;background:var(--surface-2);text-align:center}
.chart .h{background:none;font-size:13px;color:var(--ink-3);font-weight:700;padding:4px}
.chart .v{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:.12em}
.blend{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.blend>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.blend .lt{display:inline-grid;place-items:center;min-width:40px;height:44px;padding:0 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-size:20px}
.blend .arrow{color:var(--ink-3)}
.blend .res{font-family:var(--f-display);font-size:22px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin-top:14px}
.chain div{display:flex;flex-direction:column;align-items:center;border-radius:10px;padding:8px 12px;background:var(--surface-2);border:1.5px solid var(--line)}
.chain div.root{border-color:var(--vb)}
.chain b{font-family:var(--f-display);font-size:19px}
.chain span{font-size:12.5px;color:var(--ink-3)}
.dlg{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.say{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.say.me{align-self:flex-end;background:color-mix(in srgb,var(--madder) 9%,var(--surface));border-color:color-mix(in srgb,var(--madder) 30%,var(--line))}
.say small{display:block;font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
.say .tk{font-size:17px}
.say .zh{display:block;font-size:14px;color:var(--ink-2)}
.name-in{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.name-in input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}

/* ============ Questions ============ */
.q-prompt{font-size:19px;font-weight:700;margin-bottom:6px}
.q-hint{color:var(--ink-2);margin-bottom:14px}
.q-big{font-size:clamp(34px,7vw,52px);line-height:1.15;margin:8px 0 14px;font-family:var(--f-display);font-weight:700;word-break:break-word}
.q-emoji{font-size:64px;line-height:1.1;margin:4px 0 8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opts.one{grid-template-columns:1fr}
.opt{position:relative;display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 14px 14px 12px;min-height:58px;font-size:17px;line-height:1.35;transition:border-color .15s,background .15s,transform .08s}
.opt:hover:not([disabled]){border-color:var(--ink-3)}
.opt:active:not([disabled]){transform:translateY(1px)}
.opt .k{flex:none;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--ink-3)}
.opt .tk{font-size:18px}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:54px;font-size:16.5px;text-align:center;transition:border-color .15s,opacity .3s,background .15s}
.mt.sel{border-color:var(--vb);background:color-mix(in srgb,var(--vb) 10%,var(--surface))}
.mt.done{opacity:.35;border-style:dashed;cursor:default}
.mt.bad{border-color:var(--bad);background:var(--bad-soft)}

.sort-cur{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:120px;border:2px dashed var(--line);border-radius:16px;margin:8px 0 14px;padding:12px;text-align:center}
.sort-cur .tk{font-family:var(--f-display);font-size:34px;font-weight:700}
.sort-cur .note{font-size:14px;margin-top:6px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;min-height:110px;display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:left}
.bin:hover:not([disabled]){border-color:var(--ink-3)}
.bin b{font-size:15px}
.bin .got{display:flex;flex-wrap:wrap;gap:4px}
.bin .got > span{font-size:13.5px;padding:1px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.bin.flash-ok{border-color:var(--ok)}
.bin.flash-bad{border-color:var(--bad)}

.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:64px;align-items:center;justify-content:center;padding:10px;border-radius:14px;border:2px dashed var(--line);margin:6px 0 14px}
.slots .ph{color:var(--ink-3);font-size:14px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{min-width:48px;height:52px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-family:var(--f-display);font-size:21px;font-weight:700;box-shadow:0 2px 0 var(--line)}
.tile:hover:not([disabled]){border-color:var(--ink-3)}
.tile[disabled]{opacity:.25;cursor:default;box-shadow:none}
.tile.word{font-family:var(--f-body);font-size:18px;height:auto;min-height:48px;padding:8px 14px}
.slot{min-width:40px;height:48px;padding:0 10px;border-radius:10px;border:2px solid var(--vb);background:color-mix(in srgb,var(--vb) 7%,var(--surface));font-family:var(--f-display);font-size:20px;font-weight:700}
.slot.word{font-family:var(--f-body);font-size:18px;height:auto;min-height:44px;padding:6px 12px}
.slot.root{border-color:var(--ink-3);background:var(--surface-2);cursor:default}
.slot.sfx{border-color:var(--vf);background:color-mix(in srgb,var(--vf) 8%,var(--surface))}
.q-tools{display:flex;justify-content:center;gap:8px;margin-top:10px}

.npc{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px}
.npc .av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--rug);color:var(--rug-ivory);font-weight:800;font-size:15px}
.npc .say{max-width:100%}

/* Feedback / action bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));transition:background .2s}
.bar-in{max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bar.ok{background:var(--ok-soft);border-top-color:var(--ok)}
.bar.bad{background:var(--bad-soft);border-top-color:var(--bad)}
.fb{flex:1;min-width:0}
.fb b{display:block;font-size:18px}
.bar.ok .fb b{color:var(--ok)}
.bar.bad .fb b{color:var(--bad)}
.fb .why{font-size:14.5px;color:var(--ink);margin-top:2px}
.fb .ans{font-size:15px;margin-top:2px}
.bar-in .btn{flex:none}

/* Result */
.result{text-align:center;padding-top:10px}
.result .gul-big{width:min(300px,78vw);height:auto;margin:6px auto 10px;display:block}
.result h2{font-size:26px}
.stars{font-size:34px;letter-spacing:.18em;color:var(--rug-saffron);margin:6px 0}
.stars .off{color:var(--line)}
.result .stat{color:var(--ink-2);font-variant-numeric:tabular-nums}
.result .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.weave path.o{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s ease forwards}
.weave .fillin{opacity:0;animation:fadein .6s ease .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}

/* Modal / sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,22,.45);display:grid;place-items:center;padding:16px}
.sheet{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px;padding:22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.sheet-h h2{font-size:20px}
.field{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-bottom:1px solid var(--line)}
.field label{font-weight:700}
.field input[type=text]{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch input{width:44px;height:26px;accent-color:var(--madder)}

/* Page (alphabet / words) */
.page-head{display:flex;align-items:center;gap:10px;padding-block:14px}
.page-head h2{font-size:22px;flex:1}
.abc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.lt2{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:96px}
.lt2:hover{border-color:var(--ink-3)}
.lt2 b{font-family:var(--f-display);font-size:26px;line-height:1.2}
.lt2 .ipa{font-size:14px}
.lt2 .g{font-size:11px;color:var(--ink-3)}
.lt2.trap{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.lt2.trap::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 14px 14px 0;border-color:transparent var(--bad) transparent transparent;border-top-right-radius:10px}
.lt2.hat{border-color:color-mix(in srgb,var(--vb) 40%,var(--line))}
.abc-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);padding-block:12px}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:12px}
.wl{display:flex;flex-direction:column;margin-bottom:22px}
.wl h3{font-size:14px;color:var(--ink-3);letter-spacing:.06em;margin:10px 0 4px}
.wrow{display:grid;grid-template-columns:32px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.1fr);gap:10px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line)}
.wrow .em{font-size:20px}
.wrow .tk{font-size:17px}
.empty{padding:28px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:14px}

/* ============ Responsive ============ */
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .rug-row{grid-template-columns:1fr;gap:8px}
  .rug-inner{padding:4px 10px}
  .gbtn{width:calc(33.333% - 3px)}
  .gbtn svg{width:100%;max-width:88px;height:auto}
  .abc{grid-template-columns:repeat(5,minmax(0,1fr))}
  .wrow{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr)}
  .wrow .ipa{display:none}
}
@media (max-width:520px){
  .opts{grid-template-columns:1fr}
  .lc{grid-template-columns:1fr}
  .lc-big{font-size:64px}
  .card{padding:18px}
  .stage{padding-top:14px}
  .bar-in{flex-wrap:wrap}
  .bar-in .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .weave path.o{stroke-dashoffset:0}
  .weave .fillin{opacity:1}
}

/* ============ Audio ============ */
.spk{display:inline-flex;align-items:center;justify-content:center;gap:6px;vertical-align:middle;border:1.5px solid var(--line);background:var(--surface);color:var(--madder);border-radius:999px;width:34px;height:34px;padding:0;margin-left:6px;flex:none;transition:background .15s,border-color .15s,transform .08s}
.spk:hover{border-color:var(--madder);background:color-mix(in srgb,var(--madder) 8%,var(--surface))}
.spk:active{transform:scale(.94)}
.spk.sm{width:28px;height:28px;margin-left:4px}
.spk.sm svg{width:15px;height:15px}
.spk.lc-play{width:auto;height:40px;padding:0 14px 0 10px;border-radius:12px;font-weight:700;font-size:15px;background:var(--madder);color:var(--on-madder);border-color:transparent;margin:2px 0 4px;align-self:flex-start}
.spk.lc-play:hover{background:var(--madder-2)}
.spk.lc-play svg{width:20px;height:20px}
.spk.playing,.btn.playing{box-shadow:0 0 0 3px color-mix(in srgb,var(--madder) 35%,transparent)}
.spk.playing svg{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.tap{cursor:pointer;text-decoration:underline dotted color-mix(in srgb,currentColor 55%,transparent);text-decoration-thickness:1.5px;text-underline-offset:3px;border-radius:4px}
.tap:hover{background:color-mix(in srgb,var(--madder) 9%,transparent)}
.tap.playing{background:color-mix(in srgb,var(--madder) 16%,transparent)}
.lt.tap{text-decoration:none}
.pairs .pl{display:inline-flex;align-items:center;flex-wrap:wrap;gap:2px}
.listen{display:flex;align-items:center;gap:12px;margin:6px 0 16px;flex-wrap:wrap}
.listen-btn{min-height:56px;font-size:18px;padding:12px 26px}
.listen-btn svg{width:24px;height:24px}
.bar-in .btn.ghost.sm{margin-left:auto}
.bar .btn.ghost.sm svg{width:16px;height:16px}
@media (max-width:520px){
  .bar-in .btn.ghost.sm{width:auto;margin-left:0}
}

/* native-recording markers */
.spk.nat{position:relative}
.spk.nat::after{content:'';position:absolute;right:-2px;top:-2px;width:7px;height:7px;border-radius:50%;background:#2f9e5b;box-shadow:0 0 0 2px var(--surface)}
.chip-nat{background:#e6f5eb;color:#1f6f40;border-color:#bfe3cc}

</style>

<script>
/* Shared between the game and the audio generator: turns any Turkmen string
   (with {braces}, [ipa], {NAME}, punctuation, Chinese glosses) into the key used
   to look up its clip in the audio sprite. */
function akey(s){
  if(s == null) return '';
  let t = String(s);
  t = t.replace(/\{NAME\}/g, ' ');
  t = t.replace(/\[[^\]]*\]/g, ' ');
  t = t.replace(/[{}]/g, '');
  t = t.toLowerCase();
  t = t.replace(/[^a-zäçňöşüýž'\- ]+/g, ' ');
  t = t.replace(/\s+/g, ' ').trim();
  t = t.split(' ').map(w => w.replace(/^-+|-+$/g, '')).filter(Boolean).join(' ');
  return t;
}
const LETTER_NAME = {a:'a',e:'e',ä:'ä',i:'i',y:'y',o:'o',ö:'ö',u:'u',ü:'ü',
  b:'be',ç:'çe',d:'de',f:'ef',g:'ge',h:'he',j:'je',ž:'že',k:'ke',l:'el',m:'em',n:'en',ň:'eň',p:'pe',r:'er',s:'es',ş:'şe',t:'te',w:'we',ý:'ýe',z:'ze'};
/* text actually sent to the synthesizer for a key */
function asynth(key){
  if(key.length === 1 && LETTER_NAME[key]) return LETTER_NAME[key] + ' ' + LETTER_NAME[key];
  return key.replace(/-/g, '');
}

</script>

        '<div class="h">细 inçe<br>舌头靠前</div><div class="v">'+tkColor('e ä i')+'</div><div class="v">'+tkColor('ö ü')+'</div></div></div>';
    case 'grid':
      return '<div class="card"><h2>'+fmt(c.h)+'</h2><div class="lgrid">'+c.letters.map(k => { const L = LETTER[k]; return '<div><b class="tk'+sayAttrs(L.l)+'">'+L.u+L.l+'</b> <span class="ipa">['+esc(L.ipa)+']</span>'+tk(L.w[0])+spk(L.w[0], 'sm')+'<span class="tiny">'+(L.w[2]||'')+' '+esc(L.w[1])+'</span></div>'; }).join('')+'</div></div>';
    case 'pairs':
      return '<div class="card"><h2>'+fmt(c.h)+'</h2>'+(c.b?'<div class="body">'+fmt(c.b)+'</div>':'')+'<div class="pairs">'+c.items.map(it => '<div><span class="pl">'+tkWithIpa(it[0])+spk(it[0], 'sm')+'</span><span>'+fmt(it[1])+'</span></div>').join('')+'</div></div>';
    case 'table':
      return '<div class="card"><h2>'+fmt(c.h)+'</h2>'+(c.b?'<div class="body">'+fmt(c.b)+'</div>':'')+'<div class="tbl-wrap"><table class="tbl"><thead><tr>'+c.head.map(h => '<th>'+fmt(h)+'</th>').join('')+'</tr></thead><tbody>'+c.rows.map(r => '<tr>'+r.map((v,i) => '<td>'+(i===0?esc(v):tk(v)+spk(v, 'sm'))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></div>';
    case 'blend':
      return '<div class="card"><h2>'+fmt(c.h)+'</h2><div class="blend">'+c.items.map(it => '<div>'+it[0].map(ch => '<span class="lt'+sayAttrs(ch)+'">'+tkColor(ch)+'</span>').join('<span class="arrow">+</span>')+'<span class="arrow">→</span><span class="res tk'+sayAttrs(akey(it[1]))+'">'+tkColor(it[1])+'</span>'+spk(it[1], 'sm')+' <span class="ipa">'+ipaOf(it[1])+'</span> <span class="muted">'+it[2]+' '+esc(it[3])+'</span></div>').join('')+'</div></div>';
    case 'chain':
      return '<div class="card"><h2>'+fmt(c.h)+'</h2><div class="chain">'+c.parts.map((p,i) => '<div class="'+(i===0?'root':'')+'"><b class="tk'+sayAttrs(akey(p[0]))+'">'+tkColor(p[0])+'</b><span>'+esc(p[1])+'</span></div>').join('<div style="border:0;background:none;justify-content:center;padding:0 2px">+</div>')+'</div><p class="body" style="margin-top:14px">= '+tk(c.result)+spk(c.result, 'sm')+' <span class="muted">'+esc(c.zh)+'</span></p></div>';
    case 'dialog':
      return '<div class="card"><h2>'+fmt(c.h)+'</h2><div class="dlg">'+c.lines.map(l => '<div class="say'+(l[0]==='ME'?' me':'')+'"><small>'+esc(WHO[l[0]]||l[0])+'</small>'+tk(l[1])+spk(l[1], 'sm')+'<span class="zh">'+fmt(l[2].replace(/\{NAME\}/g,'{NAME}'))+'</span></div>').join('')+'</div></div>';
    case 'name':
      return '<div class="card"><h2>先告诉我你的名字</h2><div class="body"><p>下面的对话和练习会用上它。不填就用“'+esc('Li Hua')+'”（没错，就是那位李华）。</p></div>'+
        '<div class="name-in"><label class="sr" for="name-card">你的名字</label><input id="name-card" type="text" maxlength="24" placeholder="例如：Li Hua" value="'+esc(P.name||'')+'"><button class="btn sm" data-act="save-name-card">保存</button></div>'+
        '<p class="tiny" style="margin-top:8px">当前：'+esc(playerName())+'</p></div>';
  }
  return '';
}

/* ---------- LEVEL ---------- */
function startLevel(id, skipLearn){
  const lv = LV(id);
  SES = {mode:'level', lv, phase: skipLearn ? 'quiz' : 'learn', card:0};
  if(skipLearn) initQuiz();
  go('level');
}
function initQuiz(){
  const lv = SES.lv;
  SES.phase = 'quiz';
  SES.queue = lv.quiz.map((q,i) => ({lid:lv.id, qi:i}));
  prepSession();
}
function startReview(){
  if(!P.review.length){ MODAL = {type:'msg', h:'复习篮是空的', b:'答错的题会自动放进复习篮。先去地毯上玩几关吧。'}; render(); return; }
  const picks = shuffle(P.review).slice(0,10).map(k => { const [lid,qi] = k.split('#'); return {lid, qi:+qi}; }).filter(it => LV(it.lid) && LV(it.lid).quiz[it.qi]);
  SES = {mode:'review', lv:null, phase:'quiz', queue:picks};
  prepSession();
  go('level');
}
function prepSession(){
  SES.pos = 0; SES.first = {}; SES.done = new Set(); SES.requeued = {};
  SES.total = new Set(SES.queue.map(k => k.lid+'#'+k.qi)).size;
  startQ();
}
const curItem = () => SES.queue[SES.pos];
const curQ = () => { const it = curItem(); return LV(it.lid).quiz[it.qi]; };
const keyOf = it => it.lid+'#'+it.qi;
function nameSub(s){ return String(s).replace(/\{NAME\}/g, playerName()); }

function startQ(){
  const q = curQ();
  QS = {state:null};
  if(q.q === 'choice' || q.q === 'dialog' || q.q === 'listen'){
    QS.opts = shuffle(q.o.map((o,i) => ({o, ok:i===0})));
    QS.picked = null;
    if(q.q === 'listen') autoPlay([q.key]);
    if(q.q === 'dialog') autoPlay([akey(q.line)]);
  } else if(q.q === 'match'){
    const n = q.pairs.length;
    QS.L = shuffle([...Array(n).keys()]); QS.R = shuffleNot([...Array(n).keys()], QS.L);
    QS.sel = null; QS.done = new Set(); QS.mist = 0; QS.bad = null;
  } else if(q.q === 'sort'){
    QS.order = shuffle([...q.items.keys()]); QS.k = 0; QS.placed = [[],[]]; QS.mist = 0; QS.note = '';
  } else if(q.q === 'spell'){
    const letters = [...q.a].concat([...(q.extra||'')]);
    QS.tiles = shuffle(letters); QS.seq = [];
  } else if(q.q === 'build'){
    QS.seq = [];
  } else if(q.q === 'order'){
    const toks = q.w.map(nameSub).concat(q.extra||[]);
    QS.pool = shuffleNot(toks, toks); QS.seq = [];
  }
}

function viewLevel(){
  const s = SES;
  const isReview = s.mode === 'review';
  const title = isReview ? '复习篮' : s.lv.id+' · '+s.lv.title;
  const sub = isReview ? '把答错过的题再做一遍' : s.lv.layer.name+'（'+s.lv.layer.analog+'）';
  let pct = 0;
  if(s.phase === 'quiz') pct = Math.round(100 * s.done.size / Math.max(1,s.total));
  if(s.phase === 'result') pct = 100;
  const skip = (!isReview && s.phase === 'learn') ? '<button class="link" data-act="skip-learn">跳到练习 →</button>' : '';
  let head = '<div class="lv-head"><div class="wrap"><div class="lv-row"><button class="link" data-act="home" aria-label="回到地毯">← 地毯</button><div class="lv-title"><b>'+esc(title)+'</b><span>'+esc(sub)+'</span></div>'+skip+'</div>'+
    (s.phase !== 'learn' ? '<div class="band" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>' : '')+'</div></div>';
  let body = '', bar = '';
  if(s.phase === 'learn'){
    const cards = s.lv.learn, i = s.card;
    if(cards[i].t === 'letter' && hasAudio(cards[i].k)) autoPlay([cards[i].k, akey(LETTER[cards[i].k].w[0])]);
    body = '<p class="phase">学 · '+(i+1)+' / '+cards.length+(Object.keys(AUD.map).length && i === 0 ? '<span class="tiny" style="margin-left:10px;font-weight:400;letter-spacing:0;text-transform:none">点喇叭或带下划线的词可以听发音</span>' : '')+'</p>'+viewCard(cards[i])+
      '<div class="dots" aria-hidden="true">'+cards.map((_,j) => '<i class="'+(j===i?'on':'')+'"></i>').join('')+'</div>';
    bar = '<div class="bar"><div class="bar-in">'+
      '<button class="btn ghost" data-act="prev-card" '+(i===0?'disabled':'')+'>上一张</button>'+
      (i < cards.length-1 ? '<button class="btn" data-act="next-card">下一张</button>' : '<button class="btn" data-act="start-quiz">开始练习 →</button>')+
      '</div></div>';
  } else if(s.phase === 'quiz'){
    body = '<p class="phase">'+(isReview ? '复习 · 来自 '+esc(curItem().lid) : '练')+' · 第 '+(s.pos+1)+' 题'+(s.pos >= s.total ? '（回炉）' : '')+'</p><div class="card">'+viewQ()+'</div>';
    bar = viewBar();
  } else if(s.phase === 'result'){
    body = viewResult();
  }
  return head+'<main class="stage">'+body+'</main>'+bar;
}

/* ---------- QUESTIONS ---------- */
function optHTML(q, o){ return q.tk ? tk(o) : fmt(o); }
function tokHTML(t){ return t === playerName() ? '<span class="nm">'+esc(t)+'</span>' : tk(t); }
function viewQ(){
  QUIET = true;   // words inside option/tile buttons are never tappable; the feedback bar and the NPC line are
  try{ return viewQInner(); } finally { QUIET = false; }
}
function viewQInner(){
  const q = curQ(), st = QS.state;
  if(q.q === 'choice' || q.q === 'dialog' || q.q === 'listen'){
    const long = QS.opts.some(o => String(o.o).replace(/[{}]/g,'').length > 16);
    let top = '';
    if(q.q === 'dialog'){
      QUIET = false;
      top = '<div class="npc"><div class="av" aria-hidden="true">'+esc((q.who||'?')[0])+'</div><div class="say"><small>'+esc(WHO[q.who]||q.who)+'</small>'+tk(q.line)+spk(q.line, 'sm')+'<span class="zh">'+esc(q.lineZh||'')+'</span></div></div>';
      QUIET = true;
      top += '<p class="q-prompt">'+fmt(q.p)+'</p>';
    } else if(q.q === 'listen'){
      top = '<p class="q-prompt">'+fmt(q.p || '听发音，选出你听到的')+'</p><div class="listen"><button class="btn listen-btn" data-act="say" data-key="'+esc(q.key)+'" aria-label="播放发音">'+ICON_SPK+' 播放</button><span class="tiny">可以反复听</span></div>';
    } else {
      top = '<p class="q-prompt">'+fmt(q.p)+'</p>'+(q.emoji?'<div class="q-emoji" aria-hidden="true">'+q.emoji+'</div>':'');
    }
    return top+'<div class="opts'+(long?' one':'')+'">'+QS.opts.map((o,i) => {
      let cls = '';
      if(st){ if(o.ok) cls = ' ok'; else if(QS.picked === i) cls = ' bad'; }
      return '<button class="opt'+cls+'" data-act="pick" data-i="'+i+'" '+(st?'disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+optHTML(q,o.o)+'</span></button>';
    }).join('')+'</div>';
  }
  if(q.q === 'match'){
    const tile = (side, idx) => {
      const done = QS.done.has(idx);
      const sel = QS.sel && QS.sel.side === side && QS.sel.i === idx;
      const bad = QS.bad && QS.bad[side] === idx;
      const label = side === 'l' ? tk(q.pairs[idx][0]) : fmt(q.pairs[idx][1]);
      return '<button class="mt'+(done?' done':'')+(sel?' sel':'')+(bad?' bad':'')+'" data-act="mt" data-side="'+side+'" data-i="'+idx+'" '+(done||st?'disabled':'')+'>'+label+'</button>';
    };
    return '<p class="q-prompt">'+fmt(q.p)+'</p><p class="q-hint">先点左边，再点右边。</p><div class="match"><div class="mcol">'+QS.L.map(i => tile('l',i)).join('')+'</div><div class="mcol">'+QS.R.map(i => tile('r',i)).join('')+'</div></div>';
  }
  if(q.q === 'sort'){
    const cur = QS.k < q.items.length ? q.items[QS.order[QS.k]] : null;
    const curHTML = cur ? (q.tk ? '<span class="tk">'+tkColor(cur[0])+'</span>' : '<span class="tk">'+fmt(cur[0])+'</span>') : '<span class="muted">分完了！</span>';
    return '<p class="q-prompt">'+fmt(q.p)+'</p><p class="q-hint">第 '+Math.min(QS.k+1,q.items.length)+' / '+q.items.length+' 个</p>'+
      '<div class="sort-cur">'+curHTML+(QS.note?'<div class="note">'+QS.note+'</div>':'')+'</div>'+
      '<div class="bins">'+q.bins.map((b,bi) => '<button class="bin" data-act="bin" data-b="'+bi+'" '+(cur&&!st?'':'disabled')+'><b>'+fmt(b)+'</b><div class="got">'+QS.placed[bi].map(it => '<span>'+(q.tk?tk(it):fmt(it))+'</span>').join('')+'</div></button>').join('')+'</div>';
  }
  if(q.q === 'spell'){
    const slots = QS.seq.length ? QS.seq.map((ti,j) => '<button class="slot" data-act="unslot" data-j="'+j+'" '+(st?'disabled':'')+' aria-label="移除 '+esc(QS.tiles[ti])+'">'+tkColor(QS.tiles[ti])+'</button>').join('') : '<span class="ph">点下面的字母拼出单词</span>';
    const used = new Set(QS.seq);
    return '<p class="q-prompt">拼出这个词</p><div class="q-emoji" aria-hidden="true">'+esc(q.hint.split(' ')[0])+'</div><p class="q-hint">'+esc(q.hint.split(' ').slice(1).join(' '))+'</p>'+
      '<div class="slots" aria-live="polite">'+slots+'</div>'+
      '<div class="tiles">'+QS.tiles.map((t,i) => '<button class="tile" data-act="tile" data-i="'+i+'" '+(used.has(i)||st?'disabled':'')+'>'+esc(t)+'</button>').join('')+'</div>'+
      '<div class="q-tools"><button class="link" data-act="back" '+(st?'disabled':'')+'>⌫ 删一个</button><button class="link" data-act="clear" '+(st?'disabled':'')+'>清空</button></div>';
  }
  if(q.q === 'build'){
    const line = '<span class="slot root">'+tkColor(q.root)+'</span>'+QS.seq.map((b,j) => '<span class="arrow" aria-hidden="true">+</span><button class="slot sfx" data-act="unbuild" data-j="'+j+'" '+(st?'disabled':'')+'>'+tkColor(b)+'</button>').join('');
    return '<p class="q-prompt">'+fmt(q.p)+'</p><p class="q-hint">按顺序点词缀，挂到词根后面。点已挂上的词缀可以取下。</p>'+
      '<div class="slots">'+line+'</div>'+
      '<div class="tiles">'+q.blocks.map((b,i) => '<button class="tile word" data-act="block" data-i="'+i+'" '+(st?'disabled':'')+'>+'+tkColor(b)+'</button>').join('')+'</div>';
  }
  if(q.q === 'order'){
    const used = new Set(QS.seq);
    const slots = QS.seq.length ? QS.seq.map((pi,j) => '<button class="slot word" data-act="unorder" data-j="'+j+'" '+(st?'disabled':'')+'>'+tokHTML(QS.pool[pi])+'</button>').join('')+(st?'<span class="tk" style="font-size:20px">'+esc(q.end||'')+'</span>':'') : '<span class="ph">按顺序点下面的词</span>';
    return '<p class="q-prompt">'+fmt(q.p)+'</p><p class="q-hint">记住：动词压轴。</p><div class="slots">'+slots+'</div>'+
      '<div class="tiles">'+QS.pool.map((w,i) => '<button class="tile word" data-act="ord" data-i="'+i+'" '+(used.has(i)||st?'disabled':'')+'>'+tokHTML(w)+'</button>').join('')+'</div>';
  }
  return '';
}
function answerKey(q){
  if(q.q === 'listen') return q.key;
  if(q.q === 'choice' || q.q === 'dialog'){ if(q.tk) return akey(q.o[0]); const m = String(q.o[0]).match(/\{([^{}]+)\}/); return m ? akey(m[1]) : ''; }
  if(q.q === 'spell') return akey(q.a);
  if(q.q === 'build') return akey(q.forms[q.forms.length-1]);
  if(q.q === 'order') return akey(q.w.join(' '));
  return '';
}
function answerText(q){
  if(q.q === 'choice' || q.q === 'dialog' || q.q === 'listen') return q.tk ? tk(q.o[0]) : fmt(q.o[0]);
  if(q.q === 'spell') return tk(q.a)+' <span class="ipa">'+ipaOf(q.a)+'</span>';
  if(q.q === 'build') return tk(q.root)+' + '+q.a.map(tkColor).join(' + ')+' → '+tk(q.forms[q.forms.length-1]);
  if(q.q === 'order') return tk(q.w.map(nameSub).join(' ')+(q.end||''));
  return '';
}
function viewBar(){
  const q = curQ(), st = QS.state;
  if(!st){
    const need = (q.q === 'spell' && QS.seq.length === q.a.length) || (q.q === 'build' && QS.seq.length > 0) || (q.q === 'order' && QS.seq.length === QS.pool.length);
    const checkable = ['spell','build','order'].includes(q.q);
    return '<div class="bar"><div class="bar-in"><span class="tiny">'+(checkable?'完成后点“检查”':'选一个答案（也可以按数字键）')+'</span>'+(checkable?'<button class="btn" data-act="check" '+(need?'':'disabled')+'>检查</button>':'')+'</div></div>';
  }
  let title, why = '';
  if(st === 'ok'){ title = PRAISE[Math.floor(Math.random()*PRAISE.length)]; if(q.x) why = '<div class="why">'+fmt(q.x)+'</div>'; if(q.q==='build') why = '<div class="ans">'+answerText(q)+'</div>'+why; }
  else {
    title = (q.q === 'match' || q.q === 'sort') ? '完成了，但出错 '+QS.mist+' 次' : 'Ýalňyş · 不对';
    const at = answerText(q);
    why = (at ? '<div class="ans">正确答案：'+at+'</div>' : '')+(q.x ? '<div class="why">'+fmt(q.x)+'</div>' : '')+((q.q==='match'||q.q==='sort')?'<div class="why tiny">这题已放进复习篮。</div>':'');
  }
  if(st === 'ok' && (q.q === 'match' || q.q === 'sort') && !q.x) why = '<div class="why">全部正确。</div>';
  const ak = answerKey(q);
  const again = hasAudio(ak) ? '<button class="btn ghost sm" data-act="say" data-key="'+esc(ak)+'" aria-label="再听一遍">'+ICON_SPK+' 再听</button>' : '';
  return '<div class="bar '+st+'" role="status"><div class="bar-in"><div class="fb"><b>'+title+'</b>'+why+'</div>'+again+'<button class="btn '+(st==='ok'?'ok':'bad')+'" data-act="continue">继续</button></div></div>';
}
function settle(ok){
  QS.state = ok ? 'ok' : 'bad';
  const ak = answerKey(curQ());
  if(hasAudio(ak) && curQ().q !== 'listen') autoPlay([ak]);
  render();
}
function onContinue(){
  const q = curQ(), it = curItem(), k = keyOf(it);
  const ok = QS.state === 'ok';
  if(!(k in SES.first)) SES.first[k] = ok;
  const requeueable = !['match','sort'].includes(q.q);
  if(ok || !requeueable){ SES.done.add(k); }
  else {
    SES.requeued[k] = (SES.requeued[k]||0) + 1;
    if(SES.requeued[k] <= 2) SES.queue.push(it); else SES.done.add(k);
  }
  SES.pos++;
  if(SES.pos >= SES.queue.length) finish();
  else { startQ(); render(); window.scrollTo(0,0); }
}
function finish(){
  const keys = Object.keys(SES.first);
  const good = keys.filter(k => SES.first[k]).length;
  SES.good = good; SES.n = keys.length;
  if(SES.mode === 'level'){
    const ratio = good / Math.max(1, keys.length);
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.7 ? 2 : 1;
    const prev = P.stars[SES.lv.id] || 0;
    SES.stars = stars; SES.best = Math.max(prev, stars); SES.firstTime = prev === 0;
    P.stars[SES.lv.id] = SES.best;
    keys.forEach(k => { if(!SES.first[k] && !P.review.includes(k)) P.review.push(k); });
  } else {
    keys.forEach(k => { if(SES.first[k]) P.review = P.review.filter(x => x !== k); });
  }
  save();
  SES.phase = 'result';
  autoPlay([SES.mode === 'level' && SES.stars === 3 ? 'berekella' : 'örän gowy']);
  render(); window.scrollTo(0,0);
}
function viewResult(){
  if(SES.mode === 'review'){
    return '<div class="result"><h2>复习完成</h2><p class="stat">首次答对 '+SES.good+' / '+SES.n+'，复习篮还剩 '+P.review.length+' 题。</p>'+
      '<div class="acts">'+(P.review.length?'<button class="btn" data-act="review">再复习一轮</button>':'')+'<button class="btn ghost" data-act="home">回到地毯</button></div></div>';
  }
  const lv = SES.lv, L = lv.layer;
  const nx = ALL[lv.idx+1];
  const layerDone = L.levels.every(isDone);
  const allDone = ALL.every(isDone);
  const starHTML = [1,2,3].map(i => i <= SES.stars ? '★' : '<span class="off">★</span>').join('');
  let extra = '';
  if(allDone) extra = '<p class="body" style="margin-top:14px">29 个纹样全部织完，这张地毯是你的了。<br>'+tk(PROVERB.tk)+'<br><span class="muted">'+esc(PROVERB.zh)+'</span></p>';
  else if(layerDone && lv.idx === L.levels[L.levels.length-1].idx && nx) extra = '<p class="body" style="margin-top:14px">第 '+L.n+' 层织完！下一层：<b>'+esc(nx.layer.name)+'</b>（'+esc(nx.layer.analog)+'）</p>';
  return '<div class="result"><p class="phase">'+lv.id+'</p><h2>'+(SES.firstTime ? '织好了一个纹样' : '又织了一遍')+'</h2>'+
    '<div class="weave">'+gul(L.pal,'done','gul-big')+'</div>'+
    '<div class="stars" aria-label="'+SES.stars+' 颗星">'+starHTML+'</div>'+
    '<p class="stat">首次答对 '+SES.good+' / '+SES.n+(SES.best > SES.stars ? '（最好成绩 '+SES.best+' 星）' : '')+'</p>'+extra+
    '<div class="acts">'+(nx ? '<button class="btn" data-act="open" data-id="'+nx.id+'">下一关：'+esc(shortOf(nx))+' →</button>' : '')+
    '<button class="btn ghost" data-act="retry">再练一次</button><button class="btn ghost" data-act="home">回到地毯</button></div></div>';
}

/* ---------- ALPHABET ---------- */
function viewAbc(){
  const tiles = LETTERS.map(L => '<button class="lt2 '+L.grp+'" data-act="letter" data-k="'+L.l+'" aria-label="字母 '+L.u+'，'+GROUP_NAME[L.grp]+'"><b><span class="'+(L.kind==='v'?(L.h==='b'?'vb':'vf'):'')+'">'+L.u+L.l+'</span></b><span class="ipa">['+esc(L.ipa)+']</span><span class="g">'+GROUP_NAME[L.grp]+'</span></button>').join('');
  const cnt = g => LETTERS.filter(l => l.grp === g).length;
  return '<div class="wrap"><div class="page-head"><button class="link" data-act="home">← 地毯</button><h2>30 个字母</h2></div>'+
    '<p class="muted">土库曼语字母表按这个顺序排列：'+tk(LETTERS.map(l=>l.l).join(' '))+'。点任意字母看读法。</p>'+
    '<div class="abc-legend"><span><span class="chip tag-friend">老朋友 '+cnt('friend')+'</span> 读法和拼音 / 英语基本一样</span><span><span class="chip tag-hat">戴帽子 '+cnt('hat')+'</span> 新面孔</span><span><span class="chip tag-trap">伪装者 '+cnt('trap')+'</span> 长得眼熟、读法不同（右上角红角）</span></div>'+
    '<div class="abc">'+tiles+'</div><p class="tiny" style="padding-block:16px 30px">元音按颜色区分：蓝 = 粗元音，橙 = 细元音；辅音不上色。音标为宽式标音。</p></div>';
}

/* ---------- WORD BANK ---------- */
let WQUERY = '', WALL = false;
function viewWords(){
  const seen = new Set();
  let total = 0, got = 0;
  const groups = LAYERS.map(L => {
    const rows = [];
    L.levels.forEach(lv => {
      lv.words.forEach(w => {
        const key = w[0]+'|'+w[1];
        if(seen.has(key)) return; seen.add(key); total++;
        const have = isDone(lv);
        if(have) got++;
        if(!have && !WALL) return;
        const q = WQUERY.trim().toLowerCase();
        if(q && !(w[0].toLowerCase().includes(q) || w[1].includes(q))) return;
        rows.push('<div class="wrow"><span class="em" aria-hidden="true">'+(w[2]||'')+'</span><span>'+tk(w[0])+spk(w[0], 'sm')+(isNative(akey(w[0]))?'<span class="chip chip-nat" title="母语者录音">真人</span>':'')+'</span><span class="ipa">'+ipaOf(w[0])+'</span><span class="muted">'+esc(w[1])+'<span class="tiny"> · '+lv.id+'</span></span></div>');
      });
    });
    return rows.length ? '<div class="wl"><h3>第 '+L.n+' 层 · '+esc(L.name)+'</h3>'+rows.join('')+'</div>' : '';
  }).join('');
  return '<div class="wrap"><div class="page-head"><button class="link" data-act="home">← 地毯</button><h2>词库</h2><span class="tiny">已收集 '+got+' / '+total+'</span></div>'+
    '<label class="sr" for="wq">搜索单词</label><input id="wq" class="search" type="search" placeholder="搜土库曼语或中文，如 suw、茶" value="'+esc(WQUERY)+'">'+
    '<div class="switch" style="margin-bottom:12px"><label for="wall" class="muted">显示还没学到的词</label><input id="wall" type="checkbox" '+(WALL?'checked':'')+'></div>'+
    (groups || '<div class="empty">'+(got ? '没有找到匹配的词。' : '完成关卡后，学过的词会收进这里。也可以打开上面的开关先看看全部。')+'</div>')+
    '<p class="tiny" style="padding-block:10px 30px">斜线里的音标按字母直读生成，不标长短音。</p></div>';
}

/* ---------- MODALS ---------- */
function viewModal(){
  const m = MODAL;
  if(m.type === 'letter'){
    if(hasAudio(m.k) && !m.played){ m.played = true; autoPlay([m.k, akey(LETTER[m.k].w[0])]); }
    return '<div class="scrim" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="字母详情"><div class="sheet-h"><h2>字母 '+LETTER[m.k].u+'</h2><button class="link" data-act="close" data-autofocus>关闭</button></div>'+letterCard(m.k)+'</div></div>';
  }
  if(m.type === 'msg'){
    return '<div class="scrim" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h2>'+esc(m.h)+'</h2><button class="link" data-act="close" data-autofocus>好的</button></div><p class="muted">'+esc(m.b)+'</p></div></div>';
  }
  if(m.type === 'settings'){
    return '<div class="scrim" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="设置"><div class="sheet-h"><h2>设置</h2><button class="link" data-act="close" data-autofocus>完成</button></div>'+
      '<div class="field"><label for="set-name">你的名字（用在自我介绍里）</label><input id="set-name" type="text" maxlength="24" placeholder="Li Hua" value="'+esc(P.name||'')+'"></div>'+
      '<div class="field"><div class="switch"><label for="set-sound">发音</label><input id="set-sound" type="checkbox" '+(P.sound?'checked':'')+'></div></div>'+
      '<div class="field"><div class="switch"><label for="set-autoplay">自动朗读（翻到字母卡、听力题和对话时自动播放）</label><input id="set-autoplay" type="checkbox" '+(P.autoplay?'checked':'')+'></div></div>'+
      '<div class="field"><div class="switch"><label for="set-color">元音上色（蓝 = 粗，橙 = 细）</label><input id="set-color" type="checkbox" '+(P.color?'checked':'')+'></div></div>'+
      '<div class="field"><div class="switch"><label for="set-free">试玩模式：解锁全部关卡</label><input id="set-free" type="checkbox" '+(P.free?'checked':'')+'></div><span class="tiny">正式学习时建议关闭，按顺序一层一层来。</span></div>'+
      '<div class="field"><label>重置进度</label><div><button class="btn sm '+(RESET_ARMED?'bad':'ghost')+'" data-act="reset">'+(RESET_ARMED?'再点一次，确认清空全部进度':'清空星星、复习篮和名字')+'</button></div></div>'+
      '<div class="field" style="border-bottom:0"><label>关于</label><p class="tiny">发音有两个来源：<b>母语者录音</b>（'+Object.values(AUD.map).filter(v=>v[2]===1).length+' 条，含全部 30 个字母的名称和一百多个常用词句）切自美国和平队《Introduction to the Turkmen Language》的公共领域录音，由土库曼母语者朗读，喇叭上带绿点、词库里标“真人”；其余 '+Object.values(AUD.map).filter(v=>v[2]!==1).length+' 条由 Meta 开源的 MMS 土库曼语语音模型（facebook/mms-tts-tuk-script_latin）合成，并用音素识别模型逐条核对、择优。字母卡先读字母名称（be、çe、ef……），再读例词。合成音的元音（尤其 e/ä、o/u、ö/ü）不如真人分明，请以母语者录音为准。</p><p class="tiny" style="margin-top:6px">内容依据维基百科、SIL 与 Webonary 土库曼语语法、Peace Corps 教材等，详见配套的顶层设计文档。</p></div>'+
    '</div></div>';
  }
  return '';
}

/* ---------- interaction ---------- */
function onClick(e){
  const sayEl = e.target.closest('[data-say]');
  if(sayEl){ e.preventDefault(); playKey(sayEl.dataset.say, sayEl); return; }
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  if(act === 'close-bg' && e.target !== el) return; // clicks inside sheet
  const q = (VIEW === 'level' && SES && SES.phase === 'quiz') ? curQ() : null;
  switch(act){
    case 'home': SES = null; go('home'); break;
    case 'open': startLevel(el.dataset.id); break;
    case 'go-abc': go('abc'); break;
    case 'go-words': go('words'); break;
    case 'review': startReview(); break;
    case 'settings': RESET_ARMED = false; MODAL = {type:'settings'}; render(); break;
    case 'close': case 'close-bg': MODAL = null; RESET_ARMED = false; render(); break;
    case 'letter': MODAL = {type:'letter', k:el.dataset.k}; render(); break;
    case 'reset':
      if(!RESET_ARMED){ RESET_ARMED = true; render(); }
      else { P.stars = {}; P.review = []; P.name = ''; RESET_ARMED = false; save(); MODAL = null; go('home'); }
      break;
    case 'save-name-card': { const inp = document.getElementById('name-card'); if(inp){ P.name = inp.value.slice(0,24); save(); render(); } break; }
    case 'prev-card': if(SES.card > 0){ SES.card--; render(); window.scrollTo(0,0);} break;
    case 'next-card': if(SES.card < SES.lv.learn.length-1){ SES.card++; render(); window.scrollTo(0,0);} break;
    case 'start-quiz': case 'skip-learn': initQuiz(); render(); window.scrollTo(0,0); break;
    case 'retry': startLevel(SES.lv.id, true); break;
    case 'continue': onContinue(); break;
    case 'pick': if(q && !QS.state){ const i = +el.dataset.i; QS.picked = i; settle(QS.opts[i].ok); } break;
    case 'mt': if(q && !QS.state) onMatch(q, el.dataset.side, +el.dataset.i); break;
    case 'bin': if(q && !QS.state) onBin(q, +el.dataset.b); break;
    case 'tile': if(q && !QS.state){ QS.seq.push(+el.dataset.i); render(); } break;
    case 'unslot': if(q && !QS.state){ QS.seq.splice(+el.dataset.j, 1); render(); } break;
    case 'back': if(q && !QS.state){ QS.seq.pop(); render(); } break;
    case 'clear': if(q && !QS.state){ QS.seq = []; render(); } break;
    case 'block': if(q && !QS.state){ QS.seq.push(q.blocks[+el.dataset.i]); render(); } break;
    case 'unbuild': if(q && !QS.state){ QS.seq.splice(+el.dataset.j); render(); } break;
    case 'ord': if(q && !QS.state){ QS.seq.push(+el.dataset.i); render(); } break;
    case 'unorder': if(q && !QS.state){ QS.seq.splice(+el.dataset.j, 1); render(); } break;
    case 'check': if(q && !QS.state) onCheck(q); break;
    case 'say': playKey(el.dataset.key, el); break;
    case 'say-seq': playSeq(el.dataset.keys.split('|'), el); break;
  }
}
function onMatch(q, side, i){
  if(!QS.sel || QS.sel.side === side){ QS.sel = {side, i}; QS.bad = null; render(); return; }
  const l = side === 'l' ? i : QS.sel.i, r = side === 'r' ? i : QS.sel.i;
  QS.sel = null;
  if(l === r){ QS.done.add(l); QS.bad = null; playKey(akey(q.pairs[l][0])); }
  else { QS.mist++; QS.bad = {l, r}; }
  if(QS.done.size === q.pairs.length){ settle(QS.mist === 0); return; }
  render();
}
function onBin(q, b){
  const it = q.items[QS.order[QS.k]];
  const right = it[1];
  const label = q.tk ? tk(it[0]) : fmt(it[0]);
  if(b === right){ QS.note = ''; }
  else { QS.mist++; QS.note = '<span style="color:var(--bad)">上一个 '+label+' 应该放进「'+fmt(q.bins[right])+'」</span>'; }
  QS.placed[right].push(it[0]);
  if(q.tk) playKey(akey(it[0]));
  QS.k++;
  if(QS.k >= q.items.length){ settle(QS.mist === 0); return; }
  render();
}
function onCheck(q){
  if(q.q === 'spell'){ const w = QS.seq.map(i => QS.tiles[i]).join(''); if(w.length !== q.a.length) return; settle(w === q.a); }
  else if(q.q === 'build'){ if(!QS.seq.length) return; settle(QS.seq.join('|') === q.a.join('|')); }
  else if(q.q === 'order'){ if(QS.seq.length !== QS.pool.length) return; settle(QS.seq.map(i => QS.pool[i]).join(' ') === q.w.map(nameSub).join(' ')); }
}
function onKey(e){
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if(e.target && e.target.tagName === 'BUTTON' && (e.key === 'Enter' || e.key === ' ')) return;
  if(e.target && e.target.dataset && e.target.dataset.say && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); playKey(e.target.dataset.say, e.target); return; }
  if(e.key === 'Escape' && MODAL){ MODAL = null; render(); return; }
  if(VIEW !== 'level' || !SES || MODAL) return;
  if(SES.phase === 'quiz'){
    const q = curQ();
    if(!QS.state && (q.q === 'choice' || q.q === 'dialog' || q.q === 'listen') && /^[1-4]$/.test(e.key)){
      const i = +e.key - 1; if(i < QS.opts.length){ QS.picked = i; settle(QS.opts[i].ok); e.preventDefault(); }
      return;
    }
    if(e.key === 'Enter' && QS.state){ e.preventDefault(); onContinue(); return; }
    if(e.key === 'Enter' && !QS.state && ['spell','build','order'].includes(q.q)){ e.preventDefault(); onCheck(q); return; }
    if(e.key === 'Backspace' && !QS.state && q.q === 'spell'){ QS.seq.pop(); render(); e.preventDefault(); return; }
    if(!QS.state && q.q === 'spell' && e.key.length === 1){
      const idx = QS.tiles.findIndex((t,i) => t === e.key.toLowerCase() && !QS.seq.includes(i));
      if(idx >= 0){ QS.seq.push(idx); render(); e.preventDefault(); }
    }
  } else if(SES.phase === 'learn'){
    if(e.key === 'ArrowRight' || e.key === 'Enter'){ e.preventDefault(); if(SES.card < SES.lv.learn.length-1){ SES.card++; render(); } else if(e.key === 'Enter'){ initQuiz(); render(); } }
    if(e.key === 'ArrowLeft'){ if(SES.card > 0){ SES.card--; render(); } }
  }
}
function onInput(e){
  const t = e.target;
  if(t.id === 'set-name'){ P.name = t.value.slice(0,24); save(); }
  if(t.id === 'wq'){ WQUERY = t.value; const pos = t.selectionStart; render(); const n = document.getElementById('wq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
}
function onChange(e){
  const t = e.target;
  if(t.id === 'set-color'){ P.color = t.checked; save(); render(); }
  if(t.id === 'set-sound'){ P.sound = t.checked; if(!P.sound) stopAudio(); save(); render(); }
  if(t.id === 'set-autoplay'){ P.autoplay = t.checked; save(); }
  if(t.id === 'set-free'){ P.free = t.checked; save(); render(); }
  if(t.id === 'wall'){ WALL = t.checked; render(); }
}

/* ---------- boot ---------- */
let started = false;
function start(){
  if(started) return; started = true;
  load();
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onKey);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  render();
  if(Object.keys(AUD.map).length){ try{ waInit(); }catch(e){} if(!WA.loading) try{ audioEl(); }catch(e){} }
}
window.__haly = {S:() => SES, Q:() => QS, P:() => P, ALL, AUD, WA, playKey, akey};
const hot = window.claude && window.claude.hot;
if(hot && typeof hot.ready === 'function'){ try{ hot.ready(start); }catch(e){ start(); } setTimeout(start, 1500); }
else start();
})();

</script>
